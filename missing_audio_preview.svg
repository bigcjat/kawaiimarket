<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#0F172A"/>
  <rect width="400" height="400" fill="url(#grad_audio)" opacity="0.15"/>
  
  <defs>
    <radialGradient id="grad_audio" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <filter id="glow_audio" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Music Note Circle Container -->
  <circle cx="200" cy="180" r="44" fill="#1E293B" stroke="#334155" stroke-width="3" filter="url(#glow_audio)"/>
  
