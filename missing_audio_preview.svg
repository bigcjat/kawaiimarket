  <!-- Message Text -->
  <text x="200" y="260" font-family="Outfit, system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">Missing album cover</text>
  <text x="200" y="282" font-family="Outfit, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Audio NFT</text>
